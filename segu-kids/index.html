<div class="list" id="list"></div>
<p class="foot">PrevenLab Academy Kids · Segu · Detective de Peligros v1.0 · 13/10/2026</p>
</div>
<script>
let cur=0,found,err,tot;const N=5;
const $=i=>document.getElementById(i),NS='http://www.w3.org/2000/svg';
function go(k){cur=k;found=new Set();err=0;
 for(let i=0;i<N;i++){$('s'+i).style.display=i===k?'block':'none';$('b'+i).classList.toggle('on',i===k)}
 const s=$('s'+k);s.querySelectorAll('.mark').forEach(m=>m.remove());
 const hz=[...s.querySelectorAll('.hz')];tot=hz.length;
 $('list').innerHTML=hz.map((h,i)=>`<div id="l${i}">? Peligro ${i+1}</div>`).join('');
 hz.forEach((h,i)=>{h.dataset.i=i;h.onclick=e=>{e.stopPropagation();hit(h)}});
 s.querySelectorAll('.sf').forEach(f=>f.onclick=e=>{e.stopPropagation();err++;upd();say('no','👍 <b>Eso está bien.</b> '+f.dataset.m)});
 upd();say('',`Mirá con atención: hay <b>${tot} peligros</b> escondidos. Algunos son difíciles de ver. Si tocás algo que está bien, se suma un error.`)}
function hit(h){const i=+h.dataset.i;if(found.has(i)){say('ok','Ya lo encontraste: <b>'+h.dataset.n+'</b>.');return}
 found.add(i);const b=h.getBBox(),c=document.createElementNS(NS,'ellipse');
 c.setAttribute('cx',b.x+b.width/2);c.setAttribute('cy',b.y+b.height/2);c.setAttribute('rx',b.width/2+16);c.setAttribute('ry',b.height/2+16);
 c.setAttribute('fill','none');c.setAttribute('stroke','#d62828');c.setAttribute('stroke-width','5');c.setAttribute('class','mark');c.style.pointerEvents='none';h.parentNode.appendChild(c);
 const l=$('l'+i);l.className='f';l.textContent=h.dataset.n;upd();
 if(found.size===tot){const st=err===0?'⭐⭐⭐':err<=2?'⭐⭐':'⭐';say('ok',`🏆 <b>¡Encontraste los ${tot} peligros!</b> Errores: ${err} · ${st}<br>${h.dataset.m}`)}
 else say('ok','⚠️ <b>'+h.dataset.n+'.</b> '+h.dataset.m)}
function hint(){const h=[...$('s'+cur).querySelectorAll('.hz')].find(x=>!found.has(+x.dataset.i));if(!h)return;
 const b=h.getBBox(),y=b.y+b.height/2,x=b.x+b.width/2;
 say('','💡 Pista: buscá '+(y<230?'arriba':y<420?'a media altura':'cerca del piso')+', '+(x<333?'a la izquierda':x<666?'en el centro':'a la derecha')+'.')}
function upd(){$('cnt').textContent=found.size+'/'+tot;$('err').textContent=err}
function say(c,t){const p=$('fb');p.className='panel '+c;p.innerHTML=t}
go(0);
</script></body></html>
